/* ═══ STORAGE SHIM ═══════════════════════════════════════════════════════════
   Inside Claude, window.storage exists. On GitHub Pages it doesn't, so this
   shim saves to the visitor's own browser (localStorage).
   NOTE: localStorage is per-browser, NOT a shared registry. For a real shared
   list, replace these three methods with calls to a backend (e.g. Supabase).
   ════════════════════════════════════════════════════════════════════════════ */
window.storage = window.storage || {
  async get(k){ const v=localStorage.getItem("hr:"+k); if(v===null) throw new Error("not found"); return {key:k,value:v}; },
  async set(k,v){ localStorage.setItem("hr:"+k,v); return {key:k,value:v}; },
  async delete(k){ localStorage.removeItem("hr:"+k); return {key:k,deleted:true}; },
};
</script>

// ══════════════════════════════════════════════════════════════════════════════
//  TRANSLATION PROXY
//  On GitHub Pages there is no Claude login, so UI translation and name
//  transliteration need your own small server. Put its URL below.
//  Contract:  POST { prompt, maxTok }  →  { text: "<model reply>" }
//  Leave empty to keep the site in English (everything else still works).
// ══════════════════════════════════════════════════════════════════════════════
const TRANSLATE_PROXY = "";

const callClaude = async (prompt, maxTok=2500) => {
  if(!TRANSLATE_PROXY) throw new Error("Translation proxy not configured");
  const r = await fetch(TRANSLATE_PROXY, {
    method:"POST", headers:{"Content-Type":"application/json"},
    body:JSON.stringify({ prompt, maxTok }),
  });
  const d = await r.json();
  return d.text||"";
};
const safeJSON = t => { try { return JSON.parse(t.replace(/```json\n?|```/g,"").trim()); } catch { return null; } };

const fetchUITranslation = async (langCode, langLabel) => {
  const raw = await callClaude(
    `Translate these UI strings from English to ${langLabel} (code: ${langCode}). ` +
    `Return ONLY valid JSON, same keys, translated values. Keep "·", "+", emoji, and parentheses intact. ` +
    `Do not translate proper nouns or ID formats like HM-000001.\nStrings:\n${JSON.stringify(BASE)}`
  );
  return safeJSON(raw);
};
const fetchTranslit = async (nameList, script) => {
  const raw = await callClaude(
    `Phonetically transliterate these names into ${script}. Each item is "firstName|lastName". ` +
    `Return ONLY valid JSON: {"firstName|lastName":"translitFirstName|translitLastName", ...}\n` +
    `Names: ${JSON.stringify(nameList)}`, 3000
  );
  return safeJSON(raw) || {};
};

// ── LangSelect ────────────────────────────────────────────────────────────────
function LangSelect({ current, onChange }) {
  const [open,setOpen]=useState(false); const ref=useRef(null);
  const cur=LANGS.find(l=>l.c===current)||LANGS[0];
  useEffect(()=>{ const h=e=>{if(ref.current&&!ref.current.contains(e.target))setOpen(false);}; document.addEventListener("mousedown",h); document.addEventListener("touchstart",h); return()=>{document.removeEventListener("mousedown",h);document.removeEventListener("touchstart",h);}; },[]);
  return (
    <div ref={ref} style={{position:"relative"}}>
      <button onClick={()=>setOpen(o=>!o)} style={{fontSize:12,fontWeight:600,padding:"6px 10px",borderRadius:8,border:"1.5px solid #e2e8f0",background:"#fff",cursor:"pointer",fontFamily:"inherit",display:"flex",alignItems:"center",gap:5,color:"#374151"}}>
        {cur.f} {cur.l} <span style={{fontSize:9,color:"#9ca3af"}}>{open?"▲":"▼"}</span>
      </button>
      {open&&<div style={{position:"absolute",top:"calc(100% + 4px)",right:0,background:"#fff",border:"1px solid #e5e7eb",borderRadius:10,boxShadow:"0 6px 20px rgba(0,0,0,0.1)",zIndex:60,overflow:"hidden",minWidth:150}}>

    </div>

}

// ── FormField ─────────────────────────────────────────────────────────────────
function FormField({ label, value, onChange, error, req, ph, type="text", max }) {
  const [foc,setFoc]=useState(false);
  return <div><label style={lbl}>{label}{req&&<span style={{color:"#f87171",marginLeft:3}}>*</span>}</label>
    <input type={type} value={value||""} onChange={onChange} placeholder={ph||""} max={max}
      style={inp(error,foc)} onFocus={()=>setFoc(true)} onBlur={()=>setFoc(false)}/>
    {error&&<p style={{margin:"3px 0 0",fontSize:11,color:"#ef4444"}}>{error}</p>}
  </div>;
}

// ── HometownInput ─────────────────────────────────────────────────────────────
function HometownInput({ value, mapUrl, onSelect, onClear, t }) {
  const [q,setQ]=useState(value||""); const [sugs,setSugs]=useState([]); const [busy,setBusy]=useState(false); const [open,setOpen]=useState(false);
  const deb=useRef(null); const ref=useRef(null); const ok=!!(value&&mapUrl);
  useEffect(()=>{ const h=e=>{if(ref.current&&!ref.current.contains(e.target)){setOpen(false);setSugs([]);}}; document.addEventListener("mousedown",h); document.addEventListener("touchstart",h); return()=>{document.removeEventListener("mousedown",h);document.removeEventListener("touchstart",h);}; },[]);
  const search=async qry=>{
    if(qry.length<2){setSugs([]);setOpen(false);return;} setBusy(true);
    try{ const r=await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(qry)}&limit=6`); const d=await r.json();
      const items=(d.features||[]).map(f=>{ const p=f.properties,[lo,la]=f.geometry.coordinates; const pl=p.name||p.city||p.town||p.village||p.county||""; const pts=[pl,p.country].filter(Boolean).filter((v,i,a)=>a.indexOf(v)===i); return{display:pts.join(", "),lat:la,lon:lo}; }).filter(f=>f.display);
      setSugs(items); setOpen(items.length>0);
    }catch{} setBusy(false);
  };
  const handleChange=e=>{ const v=e.target.value; setQ(v); onClear(); if(!v){setSugs([]);setOpen(false);return;} clearTimeout(deb.current); deb.current=setTimeout(()=>search(v),420); };
  const pick=item=>{ const mu=gmUrl(item.lat,item.lon); setQ(item.display); setSugs([]); setOpen(false); onSelect({display:item.display,lat:item.lat,lon:item.lon,mapUrl:mu}); };
  return <div ref={ref} style={{position:"relative"}}>
    <div style={{position:"relative"}}>
      <input value={q} onChange={handleChange} placeholder={t.locSearch} autoComplete="off"
        style={{...inp(false,false),borderColor:ok?"#86efac":"#e5e7eb",background:ok?"#f0fdf4":"#fff",paddingRight:34}}/>
      <span style={{position:"absolute",right:10,top:"50%",transform:"translateY(-50%)",fontSize:13,pointerEvents:"none"}}>{busy?"⏳":ok?"✅":"📍"}</span>
    </div>
    {open&&sugs.length>0&&<div style={{position:"absolute",top:"calc(100% + 4px)",left:0,right:0,background:"#fff",border:"1px solid #e5e7eb",borderRadius:10,boxShadow:"0 6px 20px rgba(0,0,0,0.12)",zIndex:60,overflow:"hidden"}}>
      {sugs.map((s,i)=><div key={i} onClick={()=>pick(s)} style={{padding:"10px 14px",cursor:"pointer",fontSize:14,color:"#374151",borderBottom:i<sugs.length-1?"1px solid #f3f4f6":"none"}}>📍 {s.display}</div>)}
    </div>}
    <p style={{margin:"4px 0 0",fontSize:11,color:ok?"#16a34a":"#9ca3af"}}>{ok?<>✓ {t.locConfirmed} · <a href={mapUrl} target="_blank" rel="noopener noreferrer" style={{color:"#2563eb",textDecoration:"none",fontWeight:600}}>{t.mapPreview}</a></>:<>{t.locHint} · <span>{t.powered}</span></>}</p>
  </div>;
}

  // Dismiss the hover card when tapping elsewhere (touch devices)
  useEffect(()=>{
    const h=e=>{ if(!e.target.closest?.("[data-hc]")) setHov(null); };
    document.addEventListener("touchstart",h);
    return()=>document.removeEventListener("touchstart",h);
  },[]);

  useEffect(()=>{
    (async()=>{
      let ppl,cnt;
      try{ const r=await window.storage.get("humanity-reg-v2"); ppl=JSON.parse(r.value); }
      catch{ ppl=SAMPLE; }
      let maxN=0;
      ppl=ppl.map((p,i)=>{ if(p.serialId){const n=parseInt(p.serialId.slice(3));if(n>maxN)maxN=n;return{verificationLevel:"none",...p};} const n=i+1;if(n>maxN)maxN=n;return{verificationLevel:"none",...p,serialId:fmt6(n)}; });
      try{const c=await window.storage.get("humanity-reg-counter-v2");cnt=Math.max(parseInt(c.value)||0,maxN);}catch{cnt=maxN;}
      try{await window.storage.set("humanity-reg-v2",JSON.stringify(ppl));}catch{}
      try{await window.storage.set("humanity-reg-counter-v2",String(cnt));}catch{}
      const detected=(navigator.language||"en").split("-")[0].toLowerCase();
      const validLang=LANGS.find(l=>l.c===detected)?.c||"en";
      setPeople(ppl); setCounter(cnt); setLoading(false);
      if(validLang!=="en"){ setLang(validLang); applyLang(validLang,ppl); }
    })();
  },[]);

  const persist=async(data,cnt)=>{ try{await window.storage.set("humanity-reg-v2",JSON.stringify(data));}catch{} if(cnt!==undefined){try{await window.storage.set("humanity-reg-counter-v2",String(cnt));}catch{}} };

  const applyLang=async(lc,pplList)=>{
    const lo=LANGS.find(l=>l.c===lc);
    setLoadingUI(true);
    try{
      let tr; try{const r=await window.storage.get(`ui-t-${lc}`);tr=JSON.parse(r.value);}catch{}
      if(!tr){tr=await fetchUITranslation(lc,lo?.l||lc);if(tr)try{await window.storage.set(`ui-t-${lc}`,JSON.stringify(tr));}catch{}}
      if(tr) setT({...BASE,...tr});
    }catch{} setLoadingUI(false);
    const script=NL_SCRIPTS[lc];
    if(script){
      setLoadingNames(true);
      try{
        let mp; try{const r=await window.storage.get(`nt-${lc}`);mp=JSON.parse(r.value);}catch{}
        if(!mp){const names=(pplList||people).map(p=>`${p.firstName}|${p.lastName}`);mp=await fetchTranslit(names,script);if(mp)try{await window.storage.set(`nt-${lc}`,JSON.stringify(mp));}catch{}}
        if(mp) setTranslit(mp);
      }catch{setTranslit({});} setLoadingNames(false);
    } else setTranslit({});
  };

  const changeLang=lc=>{ setLang(lc); if(lc==="en"){setT(BASE);setTranslit({});}else applyLang(lc,people); };

  const addPerson=async data=>{
    const newCnt=counter+1;
    const person={...data,id:`p_${Date.now()}`,serialId:fmt6(newCnt),verificationLevel:"none",addedAt:Date.now()};
    const updated=[...people,person]; setPeople(updated); setCounter(newCnt); persist(updated,newCnt); setShowForm(false);
    setToast(`${data.firstName} ${data.lastName} · ${fmt6(newCnt)}`);
    clearTimeout(toastT.current); toastT.current=setTimeout(()=>setToast(""),4500);
    const script=NL_SCRIPTS[lang];
    if(script){ try{ const key=`${data.firstName}|${data.lastName}`; if(!translit[key]){ const mp=await fetchTranslit([key],script); if(mp?.[key]){ const upd={...translit,...mp}; setTranslit(upd); try{await window.storage.set(`nt-${lang}`,JSON.stringify(upd));}catch{} } } }catch{} }
  };

  const verifyCallback=(personId,level)=>{
    setPeople(prev=>{ const upd=prev.map(p=>p.id===personId?{...p,verificationLevel:level}:p); persist(upd); return upd; });
  };

  const onEnter=(p,r)=>{clearTimeout(hideTR.current);clearTimeout(showTR.current);showTR.current=setTimeout(()=>setHov({person:p,rect:r}),100);};
  const onLeave=()=>{clearTimeout(showTR.current);hideTR.current=setTimeout(()=>setHov(null),400);};
  const onCardEnter=()=>clearTimeout(hideTR.current);
  const onCardLeave=()=>{hideTR.current=setTimeout(()=>setHov(null),200);};

  const nats=useMemo(()=>[...new Set(people.map(p=>p.nationality))].sort(),[people]);
  const rows=useMemo(()=>{
    const q=search.toLowerCase();
    return people.filter(p=>{
      if(q&&!`${p.firstName} ${p.lastName} ${p.nationality} ${p.serialId||""}`.toLowerCase().includes(q))return false;
      if(sexF!=="ALL"&&p.sex!==sexF)return false; if(natF&&p.nationality!==natF)return false; return true;
    }).sort((a,b)=>{ const av=String(a[sortCol]||"").toLowerCase(),bv=String(b[sortCol]||"").toLowerCase(); const c=av<bv?-1:av>bv?1:0; return sortDir==="asc"?c:-c; });
  },[people,search,sexF,natF,sortCol,sortDir]);

  const hs=col=>{if(sortCol===col)setSortDir(d=>d==="asc"?"desc":"asc");else{setSortCol(col);setSortDir("asc");}};
  const thP={sortCol,sortDir,onSort:hs};
  const filtersOn=sexF!=="ALL"||natF||search;
  const isRTL=RTL.has(lang);

  if(loading) return <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",color:"#94a3b8",fontFamily:"system-ui"}}>Loading…</div>;

  return <div style={{minHeight:"100vh",background:"#f8fafc",fontFamily:"system-ui,-apple-system,sans-serif",direction:isRTL?"rtl":"ltr"}}>
    {loadingUI&&<div style={{position:"fixed",top:0,left:0,right:0,zIndex:500,background:"#1e3a8a",color:"#fff",textAlign:"center",padding:"6px",fontSize:12,fontWeight:600}}>{t.loadingUI}</div>}
    {loadingNames&&!loadingUI&&<div style={{position:"fixed",top:0,left:0,right:0,zIndex:500,background:"#7c3aed",color:"#fff",textAlign:"center",padding:"6px",fontSize:12,fontWeight:600}}>{t.loadingNames}</div>}

    <div style={{background:"#fff",borderBottom:"1px solid #e2e8f0"}}>
      <div style={{maxWidth:920,margin:"0 auto",padding:"20px 16px",display:"flex",alignItems:"flex-start",justifyContent:"space-between",gap:12}}>
        <div style={{minWidth:0}}>
          <h1 style={{margin:0,fontSize:22,fontWeight:900,color:"#0f172a",letterSpacing:"-0.02em"}}>🌍 {t.title}</h1>
          <p style={{margin:"4px 0 0",fontSize:13,color:"#64748b"}}>{t.subtitle}</p>
        </div>
        <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:8,flexShrink:0}}>
          <div style={{textAlign:"right"}}><div style={{fontSize:28,fontWeight:900,color:"#2563eb",lineHeight:1}}>{people.length.toLocaleString()}</div><div style={{fontSize:11,color:"#94a3b8",marginTop:2}}>{t.listed}</div></div>
          <LangSelect current={lang} onChange={changeLang}/>
        </div>
      </div>
    </div>

    <div style={{background:"#fff",borderBottom:"1px solid #f1f5f9",position:"sticky",top:0,zIndex:30}}>
      <div style={{maxWidth:920,margin:"0 auto",padding:"10px 16px",display:"flex",flexWrap:"wrap",alignItems:"center",gap:8}}>
        <input type="text" value={search} onChange={e=>setSearch(e.target.value)} placeholder={t.search}
          style={{fontSize:16,border:"1.5px solid #e2e8f0",borderRadius:10,padding:"7px 12px",outline:"none",flex:"1 1 200px",minWidth:0,fontFamily:"inherit"}}/>
        <div style={{display:"flex",gap:4}}>
          {[["ALL",t.all],["M",t.male],["F",t.female],["NB",t.nb]].map(([v,l])=>(
            <button key={v} onClick={()=>setSexF(v)} style={{fontSize:12,fontWeight:700,padding:"6px 12px",borderRadius:99,border:`1.5px solid ${sexF===v?"#1e3a8a":"#e2e8f0"}`,background:sexF===v?"#1e3a8a":"#fff",color:sexF===v?"#fff":"#64748b",cursor:"pointer",fontFamily:"inherit"}}>{l}</button>
          ))}
        </div>
        <select value={natF} onChange={e=>setNatF(e.target.value)} style={{fontSize:14,border:"1.5px solid #e2e8f0",borderRadius:10,padding:"7px 10px",color:"#374151",background:"#fff",outline:"none",fontFamily:"inherit"}}>
          <option value="">{t.allNats}</option>
          {nats.map(n=><option key={n} value={n}>{NAT_FLAGS[n]||""} {n}</option>)}
        </select>
        {filtersOn&&<button onClick={()=>{setSearch("");setSexF("ALL");setNatF("");}} style={{fontSize:12,color:"#94a3b8",background:"none",border:"none",cursor:"pointer",textDecoration:"underline",fontFamily:"inherit"}}>{t.clear}</button>}
        <div style={{display:"flex",gap:8,alignItems:"center",marginLeft:4}}>
          {Object.values(VL).map(v=><span key={v.label} title={v.label} style={{color:v.fg,fontSize:13,cursor:"default"}}>{v.icon}</span>)}
        </div>
        <button onClick={()=>setShowForm(true)} style={{marginLeft:"auto",background:"#2563eb",color:"#fff",border:"none",borderRadius:10,padding:"8px 16px",fontSize:13,fontWeight:800,cursor:"pointer",fontFamily:"inherit",boxShadow:"0 1px 4px rgba(37,99,235,0.3)"}}>{t.addBtn}</button>
      </div>
    </div>

    <div style={{maxWidth:920,margin:"0 auto",padding:"20px 16px"}}>
      {rows.length===0?(
        <div style={{textAlign:"center",padding:"80px 0",color:"#94a3b8"}}>
          <div style={{fontSize:48,marginBottom:12}}>🔍</div>
          <p style={{fontWeight:700,margin:0,color:"#64748b",fontSize:15}}>{t.noResults}</p>
          <p style={{fontSize:13,marginTop:6}}>{t.tryDiff} <button onClick={()=>{setSearch("");setSexF("ALL");setNatF("");}} style={{background:"none",border:"none",color:"#2563eb",cursor:"pointer",fontSize:13,textDecoration:"underline",fontFamily:"inherit"}}>{t.clearF}</button>.</p>
        </div>
      ):(
        <div style={{background:"#fff",borderRadius:16,border:"1px solid #e2e8f0",overflow:"hidden",boxShadow:"0 1px 6px rgba(0,0,0,0.06)"}}>
          <div style={{padding:"8px 16px",background:"#f8fafc",borderBottom:"1px solid #f1f5f9",display:"flex",justifyContent:"space-between",alignItems:"center",gap:8,flexWrap:"wrap"}}>
            <span style={{fontSize:12,color:"#94a3b8"}}>{rows.length.toLocaleString()}{rows.length!==people.length?` ${t.of} ${people.length.toLocaleString()}`:""} {rows.length===1?t.entry:t.entries}</span>
            <span style={{fontSize:11,color:"#9ca3af",fontStyle:"italic"}}>{t.hint}</span>
          </div>
          <div style={{overflowX:"auto",WebkitOverflowScrolling:"touch"}}>
            <table style={{width:"100%",borderCollapse:"collapse"}}>
              <thead><tr style={{background:"#f8fafc",borderBottom:"1px solid #f1f5f9"}}>
                <th style={{padding:"10px 6px 10px 16px",width:34,textAlign:"left",fontSize:11,fontWeight:700,color:"#d1d5db",userSelect:"none"}}>#</th>
                <SortTh label={t.colName} col="lastName"    {...thP}/>
                <SortTh label={t.colSex}  col="sex"         {...thP}/>
                <SortTh label={t.colNat}  col="nationality" {...thP}/>
                <SortTh label={t.colBorn} col="birthDate"   style={{paddingRight:16}} {...thP}/>
              </tr></thead>
              <tbody>{rows.map((p,i)=><PersonRow key={p.id} n={i+1} person={p} onEnter={onEnter} onLeave={onLeave} translit={translit}/>)}</tbody>
            </table>
          </div>
        </div>
      )}
      <p style={{fontSize:12,color:"#94a3b8",textAlign:"center",marginTop:16,lineHeight:1.6}}>{t.footer}</p>
    </div>

    {hov&&!verifyPerson&&<HoverCard person={hov.person} rect={hov.rect} onEnter={onCardEnter} onLeave={onCardLeave} t={t} translit={translit} onVerify={p=>{setVerifyPerson(p);setHov(null);}}/>}
    {showForm&&<AddForm onAdd={addPerson} onClose={()=>setShowForm(false)} t={t}/>}
    {verifyPerson&&<VerifyModal person={verifyPerson} t={t} onVerify={verifyCallback} onClose={()=>setVerifyPerson(null)}/>}

    {toast&&<div style={{position:"fixed",bottom:24,left:"50%",transform:"translateX(-50%)",background:"#1e3a8a",color:"#fff",padding:"10px 22px",borderRadius:12,fontSize:13,fontWeight:700,zIndex:300,boxShadow:"0 4px 16px rgba(0,0,0,0.2)",maxWidth:"90vw"}}>✓ {toast}</div>}
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
